<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Timebox</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFDF8">
<style>
  :root{
    --paper:#FFFDF8; --card:#FFFFFF; --ink:#121212; --rule:#E2DDD2; --muted:#6E6A63;
    --main:#00B26B; --work:#2F6BFF; --fun:#FF7A1A; --chore:#9C5B2E; --pending:#CFC9BE;
    --pink:#FF4F9A; --lilac:#8B5CFF; --butter:#FFD23F; --sky:#2EB6FF; --warn:#E3004F; --opt-bg:#F6F1FF;
    --serif:ui-serif,"New York","Iowan Old Style",Georgia,"Songti SC","STSong",serif;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC",sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-tap-highlight-color:transparent;background:var(--paper)}
  html,body{margin:0;color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
  body{padding:env(safe-area-inset-top) 0 calc(48px + env(safe-area-inset-bottom))}
  .wrap{max-width:560px;margin:0 auto;padding:20px 18px}
  .num{font-variant-numeric:lining-nums tabular-nums}
  input,button,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
  input:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--work);outline-offset:2px}
  input,textarea{width:100%;padding:8px 10px;border:1px solid var(--ink);border-radius:3px;background:var(--card)}
  button{transition:background-color .2s,color .2s,transform .15s}
  button:active{transform:scale(.96)}
  /* 报头：衬线大标题 + 双线 */
  .head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:3px double var(--ink)}
  .head h1{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:-.015em;margin:0;white-space:nowrap}
  .head h1::after{content:"";display:inline-block;width:7px;height:7px;margin-left:4px;border-radius:50%;background:var(--pink);vertical-align:2px}
  .nav{padding:4px 9px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:none;
    border:1px solid var(--ink);border-radius:3px;cursor:pointer}
  .nav:active,.ghost:active{background:var(--ink);color:var(--paper)}
  .strip{display:flex;height:9px;gap:2px}
  .strip div{flex-basis:0;min-width:0;border-radius:1px}
  .meta{margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
    display:flex;justify-content:space-between;gap:10px}
  .meta.over{color:var(--warn)}
  /* 任务：细线分隔的版面，不用卡片 */
  #list{margin-top:18px}
  .row{position:relative;display:flex;gap:12px;padding:16px 0;border-top:1px solid var(--rule);background:var(--paper)}
  #list .row:first-child{border-top-color:var(--ink)}
  .row.opt{margin:0 -10px;padding:16px 10px;background:var(--opt-bg)}
  .row.dragging{z-index:2;border-radius:4px;box-shadow:0 12px 32px rgba(18,18,18,.16)}
  .est{width:40px;flex-shrink:0;text-align:right;align-self:flex-start;cursor:grab;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .est b{display:block;font-family:var(--serif);font-size:26px;font-weight:600;line-height:1}
  .grip{display:block;width:10px;height:13px;margin:7px 0 0 auto;opacity:.55;
    background:radial-gradient(circle,var(--ink) 1.1px,transparent 1.4px) 0 0/5px 4.5px}
  .bar{width:4px;flex-shrink:0;border-radius:2px}
  .body{flex:1;min-width:0}
  .line{display:flex;align-items:flex-start;gap:8px}
  .task{flex:1;min-width:0;font-family:var(--serif);font-size:17px;font-weight:500;line-height:1.35;cursor:pointer}
  .task.gone{text-decoration:line-through;color:var(--muted)}
  .task.fin{color:var(--muted)}
  .more{font-family:var(--sans);color:var(--pink);font-weight:700}
  .tag{display:inline-block;margin-right:6px;padding:1px 5px;font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;line-height:14px;color:#fff;background:var(--lilac);border-radius:2px;vertical-align:2px}
  .act{display:flex;align-items:center;gap:4px;flex-shrink:0;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .act input{width:44px;padding:1px 2px;font-family:var(--serif);font-size:17px;font-weight:600;text-align:center;
    border:0;border-bottom:1px solid var(--ink);border-radius:0;background:var(--butter);transition:background-color .2s}
  .act input:placeholder-shown{background:transparent}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;align-items:center}
  .chip{padding:3px 8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    border:1px solid var(--ink);border-radius:3px;background:none;cursor:pointer}
  .chip.on{background:var(--ink);color:var(--paper)}
  .desc{display:block;min-height:84px;margin-top:10px;resize:vertical;font-family:var(--serif);font-size:16px;line-height:1.55;border-color:var(--rule)}
  .add{display:flex;gap:8px;padding-top:16px;border-top:1px solid var(--ink)}
  .solid{padding:8px 16px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--paper);
    background:var(--ink);border:1px solid var(--ink);border-radius:3px;cursor:pointer;white-space:nowrap}
  .solid:active{background:var(--pink);border-color:var(--pink)}
  .ghost{padding:8px 14px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:none;
    border:1px solid var(--ink);border-radius:3px;cursor:pointer;white-space:nowrap}
  .empty{padding:28px 0;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--muted);border-top:1px solid var(--ink)}
  .panel{margin-top:16px;padding:14px 16px 16px;font-size:13px;background:var(--card);border:1px solid var(--rule);
    border-top:4px solid var(--work);border-radius:2px}
  .panel label{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
  .panel p{font-family:var(--serif);color:var(--muted);line-height:1.6;margin:14px 0 0}
  .foot{margin-top:26px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .status{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .status.bad{color:var(--warn)}
  /* 动画：只用 backwards 填充，结束后不占着 transform，拖拽的位移才不会被盖住 */
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
  .row.enter{animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0) * 45ms)}
  .strip.enter div{transform-origin:left center;animation:grow .7s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0) * 35ms)}
  #title.swap{animation:rise .35s ease-out backwards}
  .chip.pop{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
  .desc.enter,.panel:not([hidden]){animation:rise .3s ease-out backwards}
  /* 触摸星星：纯装饰层，不接收点击 */
  .fx{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;pointer-events:none;overflow:hidden}
  .fx i{position:absolute;display:block;will-change:transform,opacity}
  .fx .star{background:var(--c);-webkit-clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);
    clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
  .fx .dot{border-radius:50%;background:var(--c)}
  .fx .ring{width:40px;height:40px;margin:-20px 0 0 -20px;border:1.5px solid var(--ink);border-radius:50%}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div style="display:flex;align-items:baseline;gap:10px">
      <button class="nav" id="prev" aria-label="Previous day">‹</button>
      <h1 id="title"></h1>
      <button class="nav" id="next" aria-label="Next day">›</button>
    </div>
    <button class="nav" id="cfgBtn">Settings</button>
  </div>

  <div style="margin-top:14px">
    <div class="strip" id="strip"></div>
    <div class="meta" id="meta"></div>
  </div>

  <div class="panel" id="panel" hidden>
    <label for="url">Apps Script URL</label>
    <input id="url" placeholder="https://script.google.com/macros/s/…/exec">
    <label for="secret">Secret (same as SECRET in Code.gs)</label>
    <input id="secret">
    <label for="cap">Default minutes per day</label>
    <input id="cap" type="number" style="width:110px">
    <p>Used when the 每日时长 sheet has no entry for that day. The Sheet is the source of truth; this device only keeps an offline copy.</p>
    <div class="foot" style="margin-top:12px">
      <button class="ghost" id="pull">Reload from sheet</button>
      <button class="ghost" id="exportBtn">Export JSON</button>
    </div>
  </div>

  <div id="list"></div>

  <div class="add">
    <input id="draft" placeholder="Add a task">
    <input id="draftMin" type="number" value="30" style="width:62px" aria-label="Minutes">
    <button class="solid" id="addBtn">Add</button>
  </div>

  <div class="foot">
    <button class="ghost" id="pushBtn">Sync now</button>
    <span class="status" id="status">Local</span>
  </div>
</div>

<script>
const STATUS = {
  pending:{label:"Todo"},
  done:{label:"Done"},
  partial:{label:"Partial"},
  deferred:{label:"Later"},
  dropped:{label:"Drop"},
};
const ORDER = ["done","partial","deferred","dropped"];
const REASONS = ["Blocked"];
// 分类 → 颜色；表里没填或填了别的就用灰色
const CATS = {"主线":"var(--main)", "工作":"var(--work)", "娱乐":"var(--fun)", "琐事":"var(--chore)"};
const KEY = "timebox-v1";

let state = { days:{}, dirty:{}, removed:{}, caps:{}, dragged:{}, settings:{url:"",secret:"",cap:420} };
let date = isoDate(new Date());
let timer = null;
let open = new Set();   // 展开了描述的任务 id
let seen = new Set(), shownDate = null, justSet = null, justOpened = null;   // 入场动画、按钮弹一下用

function isoDate(d){
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function shift(key, delta){
  const [y,m,d] = key.split("-").map(Number);
  return isoDate(new Date(y, m-1, d+delta));
}
function pretty(key){
  const [y,m,d] = key.split("-").map(Number);
  return new Date(y, m-1, d).toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric"});
}
function tasks(){ return state.days[date] || []; }
function setTasks(next){ state.days[date] = next; state.dirty[date] = true; save(); render(); queueSync(); }

function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ setStatus("Can't save on this device (private mode?)", true); }
}
function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) state = Object.assign(state, JSON.parse(raw));
  } catch(e){}
}
function setStatus(msg, bad){
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = "status" + (bad ? " bad" : "");
}

/* ---------- 同步 ---------- */
// 表里「是否完成」：ok / Partial｜原因 / Later｜… / Drop｜…（中文 部分/顺延/放弃 也认）；手填的其他文字当作 Partial 的原因
const WORDS = {"部分":"partial", "partial":"partial", "顺延":"deferred", "later":"deferred", "deferred":"deferred",
               "放弃":"dropped", "drop":"dropped", "dropped":"dropped"};
function parseResult(raw){
  const s = String(raw ?? "").trim();
  if (!s) return {status:"pending", reason:"", note:""};
  if (/^ok$/i.test(s)) return {status:"done", reason:"", note:""};
  const m = s.match(/^(部分|顺延|放弃|partial|deferred|later|dropped|drop)(?![a-z])\s*[｜|:：]?\s*(.*)$/i);
  const parts = (m ? m[2] : s).split(/\s*[｜|]\s*/).filter(Boolean);
  const reason = REASONS.includes(parts[0]) ? parts.shift() : "";
  return {status: m ? WORDS[m[1].toLowerCase()] : "partial", reason, note: parts.join("｜")};
}
function resultOf(t){
  const p = parseResult(t.raw);   // 没在手机上改过的，原样写回表里手填的文字
  if (t.raw != null && p.status===t.status && p.reason===t.reason && p.note===t.note) return t.raw;
  if (t.status === "pending") return "";
  if (t.status === "done") return "ok";
  return [STATUS[t.status].label, t.reason, t.note].filter(Boolean).join("｜");
}
function payload(){
  return {
    secret: state.settings.secret,
    date,
    rows: tasks().map(t=>({
      seq:t.seq ?? "", done_seq:t.doneSeq ?? "", task:t.task, est_min:t.est, result:resultOf(t),
      desc: (t.desc||"") !== (t.descRaw ?? "") ? (t.desc||"") : undefined,   // 描述和实际时长只发这台设备上改过的
      actual: String(t.actual ?? "") !== String(t.actualRaw ?? "") ? (t.actual ? Number(t.actual) : "") : undefined
    })),
    removed: state.removed[date] || []
  };
}
function queueSync(){
  clearTimeout(timer);
  if (!state.settings.url) return;
  setStatus("Unsynced");
  timer = setTimeout(push, 3000);
}
async function push(){
  if (!state.settings.url) { setStatus("No Apps Script URL", true); return; }
  setStatus("Syncing…");
  const body = payload();
  try {
    await fetch(state.settings.url, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(body)
    });
    state.dirty[date] = false;
    state.removed[date] = (state.removed[date]||[]).slice(body.removed.length);  // 发送途中又 ✕ 的留到下次
    body.rows.forEach(r => tasks().forEach(t => {
      if (t.task !== r.task) return;
      if (r.desc !== undefined && t.desc === r.desc) t.descRaw = r.desc;
      if (r.actual !== undefined && String(t.actual ?? "") === String(r.actual)) t.actualRaw = String(r.actual);
    }));
    save();
    setStatus("Synced " + new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}));
  } catch(e){
    setStatus("Sync failed — saved on this device", true);
  }
}
async function pull(){
  if (!state.settings.url) return;
  if (state.dirty[date]) { push(); return; }   // 本地有未同步改动，以本地为准
  setStatus("Loading…");
  try {
    const u = state.settings.url + "?date=" + date +
              "&secret=" + encodeURIComponent(state.settings.secret);
    const r = await fetch(u);
    const data = await r.json();
    if (data.error) throw new Error(data.error);   // 口令或表头不对时别把本地清空
    const olds = tasks().slice();   // 同名任务沿用原来的 id：重新读表不重播入场动画，展开的描述也不收起
    let next = (data.rows||[]).map((r,i)=>Object.assign({
      id: (j => j >= 0 ? olds.splice(j, 1)[0].id : Date.now()+i)(olds.findIndex(o => o.task === r.task)),
      task: r.task,
      est: Number(r.est_min)||30,
      category: r.category || "",
      seq: r.seq === "" || r.seq == null ? null : Number(r.seq),
      doneSeq: r.done_seq === "" || r.done_seq == null ? null : Number(r.done_seq),
      desc: r.desc || "",
      descRaw: r.desc || "",
      actual: r.actual === "" || r.actual == null ? "" : String(r.actual),
      actualRaw: r.actual === "" || r.actual == null ? "" : String(r.actual),
      raw: r.result
    }, parseResult(r.result)));
    // 这台设备上拖过顺序的那天：已有任务保持拖好的顺序，表里新加的按拟定顺序留在原位
    if (state.dragged[date]){
      const prev = tasks().map(t=>t.task);
      const known = next.filter(t=>prev.includes(t.task)).sort((a,b)=>prev.indexOf(a.task)-prev.indexOf(b.task));
      let k = 0;
      next = next.map(t => prev.includes(t.task) ? known[k++] : t);
    }
    state.days[date] = next;
    state.dirty[date] = false;
    state.removed[date] = [];
    if (data.cap) state.caps[date] = Number(data.cap); else delete state.caps[date];
    save(); render();
    setStatus("Up to date");
  } catch(e){
    setStatus("Can't reach sheet — showing local copy", true);
  }
}

/* ---------- 操作 ---------- */
function addTask(){
  const el = document.getElementById("draft");
  const name = el.value.trim();
  if (!name) return;
  const min = Number(document.getElementById("draftMin").value) || 30;
  setTasks(tasks().concat({
    id: Date.now()+Math.random(), task:name, est:min,
    status:"pending", doneSeq:null, reason:"", note:""
  }));
  el.value = ""; el.focus();
}
function setStatusOf(id, s){
  justSet = id + ":" + s;
  const finished = tasks().filter(t=>t.doneSeq!=null).length;
  setTasks(tasks().map(t=>{
    if (t.id !== id) return t;
    const off = t.status === s;
    const isFinish = s === "done" || s === "partial";
    return Object.assign({}, t, {
      status: off ? "pending" : s,
      doneSeq: off ? null : (isFinish ? (t.doneSeq ?? finished+1) : null),
      reason: s === "done" ? "" : t.reason,
      actual: !off && isFinish ? t.actual : ""
    });
  }));
}
function patch(id, k, v){
  setTasks(tasks().map(t => t.id===id ? Object.assign({},t,{[k]:v}) : t));
}
// 按住左边的分钟数上下拖；拖到屏幕上下边缘会自动滚动
function drag(e, i){
  if (e.button > 0) return;
  e.preventDefault();
  const rows = [...document.querySelectorAll("#list .row")];
  const row = rows[i], h = row.offsetHeight + parseFloat(getComputedStyle(row).marginBottom);
  const mids = rows.map(r => { const b = r.getBoundingClientRect(); return b.top + scrollY + b.height/2; });
  const y0 = e.clientY + scrollY;
  let to = i, cy = e.clientY, raf = 0;
  row.classList.add("dragging");
  const update = () => {
    const dy = cy + scrollY - y0;
    row.style.transform = "translateY(" + dy + "px)";
    to = mids.filter((m,k) => k !== i && m < mids[i] + dy).length;
    rows.forEach((r,k) => {
      if (k === i) return;
      const s = k > i && k <= to ? -h : k < i && k >= to ? h : 0;
      r.style.transform = s ? "translateY(" + s + "px)" : "";
    });
  };
  const edge = () => {
    const v = cy < 70 ? -8 : cy > innerHeight - 70 ? 8 : 0;
    if (v) { scrollBy(0, v); update(); }
    raf = requestAnimationFrame(edge);
  };
  const move = ev => { cy = ev.clientY; update(); };
  const up = () => {
    cancelAnimationFrame(raf);
    removeEventListener("pointermove", move);
    removeEventListener("pointerup", up);
    removeEventListener("pointercancel", up);
    if (to === i) { render(); return; }
    const n = tasks().slice();
    n.splice(to, 0, n.splice(i, 1)[0]);
    state.dragged[date] = true;
    setTasks(n);
  };
  addEventListener("pointermove", move);
  addEventListener("pointerup", up);
  addEventListener("pointercancel", up);
  raf = requestAnimationFrame(edge);
}

/* ---------- 渲染 ---------- */
// 完成的分钟数：填了实际时长按实际算；没填的，Done 按预计、Partial 不算
function doneMinutes(ts){
  return ts.reduce((a,t)=>{
    if (t.status !== "done" && t.status !== "partial") return a;
    return a + (t.actual !== "" && t.actual != null ? Number(t.actual) : t.status === "done" ? t.est : 0);
  }, 0);
}
// 重新触发一次 CSS 动画
function replay(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function render(){
  const fresh = date !== shownDate, popKey = justSet, openKey = justOpened;
  shownDate = date; justSet = justOpened = null;
  const title = document.getElementById("title");
  title.textContent = pretty(date);
  if (fresh) replay(title, "swap");
  const ts = tasks();
  const anyNew = ts.some(t => !seen.has(t.id));
  const total = ts.reduce((a,t)=>a+t.est,0);
  const doneMin = doneMinutes(ts);
  const cap = Number(state.caps[date]) || Number(state.settings.cap) || 420;
  // 拟定顺序里最大的数 = 可选（当天至少有两种顺序才算）
  const seqs = ts.map(t=>t.seq).filter(n=>n>0);
  const lowest = new Set(seqs).size > 1 ? Math.max(...seqs) : null;

  const strip = document.getElementById("strip");
  strip.innerHTML = "";
  strip.classList.toggle("enter", anyNew);   // 有新任务（换日期、读表、新加）时进度条从左长出来
  ts.forEach((t,k)=>{
    const d = document.createElement("div");
    d.style.setProperty("--i", k);
    d.style.flexGrow = t.est;
    // 做完的实色；部分完成粗斜纹；没做的细斜纹
    const col = CATS[t.category] || "var(--pending)";
    d.style.background = t.status === "done" ? col :
      "repeating-linear-gradient(-45deg," + col + " 0 " + (t.status === "partial" ? 4 : 1.5) + "px,#fff 0 6px)";
    d.title = t.task + " · " + t.est + " min";
    strip.appendChild(d);
  });

  const meta = document.getElementById("meta");
  meta.className = "meta" + (total>cap ? " over" : "");
  meta.innerHTML = '<span class="num">'+total+' / '+cap+' min planned'+
    (total>cap?' · over':'')+'</span><span class="num">'+doneMin+' min done</span>';

  const list = document.getElementById("list");
  list.innerHTML = "";
  if (!ts.length){
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "No tasks for this day.";
    list.appendChild(e);
    return;
  }
  ts.forEach((t,i)=>{
    const c = CATS[t.category] || "var(--pending)";
    const row = document.createElement("div");
    row.className = "row" + (lowest !== null && t.seq === lowest ? " opt" : "");
    if (!seen.has(t.id)){ row.classList.add("enter"); row.style.setProperty("--i", i); seen.add(t.id); }

    const est = document.createElement("div");
    est.className = "est num";
    est.innerHTML = "<b>"+t.est+"</b><i class=\"grip\"></i>";
    est.onpointerdown = e => drag(e, i);
    row.appendChild(est);

    const bar = document.createElement("div");
    bar.className = "bar";
    bar.style.background = c;
    bar.style.minHeight = Math.max(20, Math.min(t.est*0.6, 90)) + "px";
    row.appendChild(bar);

    const body = document.createElement("div");
    body.className = "body";
    const name = document.createElement("div");
    name.className = "task" + (t.status==="dropped" ? " gone" : t.status==="done" ? " fin" : "");
    name.textContent = t.task;
    if (row.classList.contains("opt")){
      const g = document.createElement("span"); g.className = "tag"; g.textContent = "Optional"; name.prepend(g);
    }
    const isOpen = open.has(t.id);
    if (t.desc && !isOpen){
      const m = document.createElement("span"); m.className = "more"; m.textContent = " ⋯"; name.appendChild(m);
    }
    name.onclick = () => { if (isOpen) open.delete(t.id); else { open.add(t.id); justOpened = t.id; } render(); };
    const line = document.createElement("div");
    line.className = "line";
    line.appendChild(name);
    // 完成或部分完成时，任务名右边填实际花了多少分钟
    if (t.status === "done" || t.status === "partial"){
      const act = document.createElement("label");
      act.className = "act";
      const a = document.createElement("input");
      a.className = "num";
      a.inputMode = "numeric";
      a.placeholder = "—";
      a.setAttribute("aria-label", "Actual minutes");
      a.value = t.actual ?? "";
      a.oninput = () => {
        a.value = a.value.replace(/\D/g, "").slice(0, 3);
        t.actual = a.value; state.dirty[date] = true; save(); queueSync();
        document.querySelector("#meta span:last-child").textContent = doneMinutes(tasks()) + " min done";
      };
      act.append(a, "min");
      line.appendChild(act);
    }
    body.appendChild(line);
    // 点任务名展开描述；边打边存，切走 App 也不会丢
    if (isOpen){
      const ta = document.createElement("textarea");
      ta.className = "desc" + (openKey === t.id ? " enter" : "");
      ta.placeholder = "Details";
      ta.value = t.desc || "";
      const fit = () => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; };
      ta.oninput = () => { fit(); t.desc = ta.value; state.dirty[date] = true; save(); queueSync(); };
      body.appendChild(ta);
      requestAnimationFrame(fit);
    }

    const chips = document.createElement("div");
    chips.className = "chips";
    ORDER.forEach(s=>{
      const b = document.createElement("button");
      b.className = "chip";
      b.textContent = STATUS[s].label;
      if (t.status === s){ b.classList.add("on"); if (popKey === t.id + ":" + s) b.classList.add("pop"); }
      b.onclick = ()=>setStatusOf(t.id, s);
      chips.appendChild(b);
    });
    body.appendChild(chips);

    if (t.status==="partial"||t.status==="deferred"||t.status==="dropped"){
      const rc = document.createElement("div");
      rc.className = "chips";
      REASONS.forEach(r=>{
        const b = document.createElement("button");
        b.className = "chip"; b.textContent = r;
        if (t.reason === r) b.classList.add("on");
        b.onclick = ()=>patch(t.id,"reason", t.reason===r ? "" : r);
        rc.appendChild(b);
      });
      body.appendChild(rc);
      const note = document.createElement("input");
      note.placeholder = "Why?";
      note.value = t.note || "";
      note.style.marginTop = "7px";
      note.style.fontSize = "13px";
      note.onchange = e => patch(t.id,"note", e.target.value);
      body.appendChild(note);
    }

    row.appendChild(body);
    list.appendChild(row);
  });
}

/* ---------- 启动 ---------- */
load();
["url","secret"].forEach(k=>{
  const el = document.getElementById(k);
  el.value = state.settings[k] || "";
  el.onchange = e => { state.settings[k] = e.target.value.trim(); save(); pull(); };
});
document.getElementById("cap").value = state.settings.cap || 420;
document.getElementById("cap").onchange = e => { state.settings.cap = e.target.value; save(); render(); };

document.getElementById("cfgBtn").onclick = () => {
  const p = document.getElementById("panel"); p.hidden = !p.hidden;
};
document.getElementById("prev").onclick = () => { date = shift(date,-1); render(); pull(); };
document.getElementById("next").onclick = () => { date = shift(date, 1); render(); pull(); };
document.getElementById("addBtn").onclick = addTask;
document.getElementById("draft").addEventListener("keydown", e => { if (e.key==="Enter") addTask(); });
document.getElementById("pushBtn").onclick = push;
document.getElementById("pull").onclick = pull;
document.getElementById("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(state.days,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "timebox-backup.json";
  a.click();
};

// 页面被切走/关掉时补发一次，避免 3 秒防抖还没到就退出
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && state.dirty[date]) {
    clearTimeout(timer);
    if (state.settings.url && navigator.sendBeacon) {
      navigator.sendBeacon(state.settings.url,
        new Blob([JSON.stringify(payload())], {type:"text/plain;charset=utf-8"}));
      state.dirty[date] = false;
      state.removed[date] = [];
      tasks().forEach(t => { t.descRaw = t.desc || ""; t.actualRaw = String(t.actual ?? ""); });
      save();
    }
  }
});

/* ---------- 触摸星星 ---------- */
// 点屏幕任何地方冒一圈星星，按住划动留下星轨；纯装饰，监听都是 passive，不影响点击、拖动和滚动
(() => {
  if (!Element.prototype.animate || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const layer = document.createElement("div");
  layer.className = "fx";
  document.body.appendChild(layer);
  const COLORS = ["var(--pink)", "var(--lilac)", "var(--butter)", "var(--sky)", "var(--main)", "var(--fun)", "var(--work)"];
  let live = 0, down = false, lx = 0, ly = 0, lt = 0;
  const spawn = (el, x, y, frames, ms, easing) => {
    el.style.left = x + "px"; el.style.top = y + "px";
    layer.appendChild(el); live++;
    el.animate(frames, {duration: ms, easing: easing || "linear"}).onfinish = () => { el.remove(); live--; };
  };
  // 弹出（略微超出再回落）→ 停一会儿 → 缩小淡出；dotChance 是变成小圆点的概率（星轨用）
  const star = (x, y, dist, size, ms, fall, dotChance) => {
    if (live > 90) return;   // 同时最多这么多，防止连点卡顿
    const s = document.createElement("i"), dot = Math.random() < dotChance;
    const z = size * (.65 + Math.random() * .7) * (dot ? .4 : 1);
    s.className = dot ? "dot" : "star";
    s.style.cssText = "width:" + z + "px;height:" + z + "px;margin:" + (-z/2) + "px 0 0 " + (-z/2) + "px;--c:" +
      COLORS[Math.random() * COLORS.length | 0];
    const a = Math.random() * Math.PI * 2, d = dist * (.45 + Math.random() * .55), r = (Math.random() - .5) * 300;
    const dx = Math.cos(a) * d, dy = Math.sin(a) * d;
    const at = (k, f, sc, rot) => "translate(" + dx*k + "px," + (dy*k + fall*f) + "px) scale(" + sc + ") rotate(" + r*rot + "deg)";
    spawn(s, x, y, [
      {transform: at(0, 0, 0, 0), opacity: 1, easing: "cubic-bezier(.2,.9,.3,1.25)"},
      {transform: at(.75, 0, 1.15, .4), opacity: 1, offset: .3},
      {transform: at(.9, .5, 1, .7), opacity: 1, offset: .65},
      {transform: at(1, 1, .2, 1), opacity: 0}
    ], ms * (.85 + Math.random() * .4));
  };
  addEventListener("pointerdown", e => {
    // 有的环境一次点按会连发两个 pointerdown：同一位置 50ms 内只放一次
    if (e.timeStamp - lt < 50 && Math.hypot(e.clientX - lx, e.clientY - ly) < 10) return;
    down = true; lx = e.clientX; ly = e.clientY; lt = e.timeStamp;
    const o = document.createElement("i");
    o.className = "ring";
    spawn(o, lx, ly, [{transform: "scale(.2)", opacity: .9}, {transform: "scale(1.5)", opacity: 0}], 600, "ease-out");
    for (let k = 0; k < 10; k++) star(lx, ly, 70, 18, 950, 10, .2);
  }, {passive: true});
  addEventListener("pointermove", e => {
    if (!down || (Math.hypot(e.clientX - lx, e.clientY - ly) < 16 && e.timeStamp - lt < 45)) return;
    lx = e.clientX; ly = e.clientY; lt = e.timeStamp;
    star(lx, ly, 16, 13, 800, 16, .45);
  }, {passive: true});
  addEventListener("pointerup", () => { down = false; }, {passive: true});
  addEventListener("pointercancel", () => { down = false; }, {passive: true});
})();

render();
pull();
</script>
