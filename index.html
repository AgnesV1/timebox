<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>苦昼短</title>
<meta name="description" content="Plan backwards from the deadline, one day at a time.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="苦昼短">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<script>
// 第一笔就把白天 / 夜里画对，不等模块加载：夜里打开不闪一下白，手机顶上那一条取到的颜色也从一开始就对。
// 规则同 js/day.js 的 lookAt（点过日月的管到下一个六点，别的看钟点：6 点到 18 点是白天），改那边要一起改
(function () {
  var now = new Date(), h = now.getHours(), look = h >= 6 && h < 18 ? "light" : "dark";
  try {
    var hold = ((JSON.parse(localStorage.getItem("kuzhouduan-v1")) || {}).local || {}).themeHold;
    if (hold && (hold.v === "light" || hold.v === "dark") && now.getTime() < Number(hold.until)) look = hold.v;
  } catch (e) { /* 存的东西读不出来：照钟点 */ }
  document.documentElement.setAttribute("data-theme", look);
  document.querySelector('meta[name="theme-color"]').setAttribute("content", look === "dark" ? "#0C0C13" : "#FFFFFF");
})();
</script>
<link rel="preload" href="fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/money.css">
</head>
<body>
<div class="app">
  <aside id="side" aria-label="Navigation"></aside>
  <main id="main"></main>
  <aside id="pool" aria-label="Pool" hidden></aside>
</div>
<div id="dock" aria-label="Timer"></div>
<div id="sun"></div>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:24px">苦昼短 needs JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
